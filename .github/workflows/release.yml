name: release

on:
  # 正式发版：推送 v* 标签触发（构建 + 直接发布 Release）
  # 发布说明取仓库里的 .github/release-notes/<tag>.md；发版前先写好它，见下方 Resolve release notes。
  push:
    tags: ['v*']
  # 手动构建：网页 Actions → release → Run workflow，填版本号即可出产物
  # （不需要本地 .NET 环境；因为没有 tag，产物上传为 Actions artifact 供下载）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.3.1，不要带 v 前缀）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 版本号来源区分：tag 推送取 tag 名（去掉 v 前缀）；手动触发起用输入的版本号。
      # （之前手动触发在分支上，GITHUB_REF_NAME 会取成 "main"，导致 -p:Version=main 编译失败。）
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish portable (framework-dependent, single file)
        run: >-
          dotnet publish FolderJumpTool.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/portable

      - name: Publish self-contained (single file, no runtime needed)
        run: >-
          dotnet publish FolderJumpTool.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/selfcontained

      - name: Archive artifacts
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path publish/portable/FolderJumpTool.exe `
            -DestinationPath "FolderJumpTool-$v-win-x64-portable.zip" -Force
          Compress-Archive -Path publish/selfcontained/FolderJumpTool.exe `
            -DestinationPath "FolderJumpTool-$v-win-x64.zip" -Force
          Get-FileHash "FolderJumpTool-$v-win-x64-portable.zip","FolderJumpTool-$v-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } |
            Set-Content "FolderJumpTool-$v-SHA256.txt"

      # 手动触发没有 tag，不创建 Release；产物上传为 Actions artifact，网页直接下载。
      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: FolderJumpTool-${{ steps.ver.outputs.version }}-win-x64
          path: |
            FolderJumpTool-*.zip
            FolderJumpTool-*-SHA256.txt

      # 发布说明来源：仓库内 .github/release-notes/<tag>.md（手写中文 Notes）。
      # 好处是发版前说明已经在仓库里了——不必再用 API 从外部回填 Notes，
      # 整条发版链因此不再依赖任何长期 PAT（写权限由 Actions 自动提供的 token 承担）。
      - name: Resolve release notes
        id: notes
        if: github.event_name == 'push'
        shell: bash
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "body_path=$f" >> "$GITHUB_OUTPUT"
            echo "使用发布说明文件：$f"
          else
            echo "未找到 $f —— 回退到 GitHub 自动生成的说明"
          fi

      # 只有 tag 推送才创建 Release（手动触发在分支上，没有 tag 可供关联）。
      # draft: false —— 说明已在仓库里备好，流水线直接发布，不需要人工再点 Publish。
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FolderJumpTool-*.zip
            FolderJumpTool-*-SHA256.txt
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          draft: false
